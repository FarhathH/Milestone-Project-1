                        <table class="table table-dark text-center" >

                                <tr>
                                    <th scope="col">Day</th>
                                    <th scope="col">Open</th>
                                    <th scope="col">Close</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <th scope="row">Bank-Holiday</th>
                                    <td colspan="2">Closed</td>
                                    
                                    
                                </tr>
                                <tr>

                                    <td>8:00pm</td>
                                    
                                </tr>
                                <tr>
                                    <th scope="row">Fri</th>
                                    <td>3:00pm</td>
                                    <td>10:00pm</td>
                                    
                                </tr>
                                <tr>

                                    <td>10:00pm</td>
                                </tr>
                                <tr>
